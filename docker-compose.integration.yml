name: gaerngschee-weihnachtswuensche-integration

services:
  integration-database:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: integration-root-password
      MYSQL_DATABASE: gaerngschee_integration
      MYSQL_USER: gaerngschee_integration
      MYSQL_PASSWORD: integration-password
    ports:
      - "3307:3306"
    volumes:
      - integration_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  integration-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    volumes:
      - ./backend:/var/www/html
      - ./db:/var/www/db
    env_file:
      - ./backend/.env.integration
    environment:
      PHP_DISPLAY_ERRORS: 1
    depends_on:
      integration-database:
        condition: service_healthy
      integration-mail:
        condition: service_started

  integration-mail:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  integration_db_data:
