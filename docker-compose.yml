services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaerngschee-weihnachtswuensche-backend
    ports:
      - "8083:80"
    volumes:
      - ./backend:/var/www/html
      - ./db:/var/www/db
    environment:
      - PHP_DISPLAY_ERRORS=1
      - APP_ENV=test
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=gaerngschee_weihnachtswuensche
      - DB_USER=gaerngschee_weihnachtswuensche
      - DB_PASS=weihnachtswuensche-local-password
      - JWT_SECRET=${JWT_SECRET:-077d240281f5296af33a65436217ae966bd0a36a8281cd740ef6f7f0f7faca52}

    extra_hosts:
      - "host.docker.internal:host-gateway"
