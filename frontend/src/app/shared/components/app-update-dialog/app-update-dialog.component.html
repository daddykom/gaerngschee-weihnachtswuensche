<h2 mat-dialog-title>{{ 'app.update.dialog.title' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'app.update.dialog.message' | translate }}</p>
  <p>{{ 'app.update.dialog.unsavedWarning' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">
    {{ 'app.update.dialog.later' | translate }}
  </button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">
    {{ 'app.update.dialog.reload' | translate }}
  </button>
</mat-dialog-actions>
