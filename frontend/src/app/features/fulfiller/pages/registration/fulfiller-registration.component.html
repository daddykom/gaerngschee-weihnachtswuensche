<section class="gl-stack gl-stack--section">
  <section class="gl-stack gl-stack--group" aria-labelledby="fulfiller-registration-heading">
    <p class="lead">{{ 'app.fulfillerRegistration.lead' | translate }}</p>
    <h2 id="fulfiller-registration-heading">
      {{ 'app.fulfillerRegistration.emailHeading' | translate }}
    </h2>
    <form class="gl-stack gl-stack--group" (submit)="$event.preventDefault(); submit()">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'app.fulfillerRegistration.emailLabel' | translate }}</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput type="email" autocomplete="email" [formField]="form.email" />
        <app-control-error
          matError
          [control]="form.email()"
          translationPrefix="app.fulfillerRegistration.errors.email"
        />
      </mat-form-field>
      <mat-checkbox [formField]="form.privacyAccepted">
        {{ 'app.fulfillerRegistration.privacyConsent' | translate }}
      </mat-checkbox>
      <app-control-error
        matError
        [control]="form.privacyAccepted()"
        translationPrefix="app.fulfillerRegistration.errors.privacyAccepted"
      />
      <p>
        <a routerLink="/datenschutz">{{ 'app.fulfillerRegistration.privacyLink' | translate }}</a>
      </p>
      <button mat-flat-button type="submit" (click)="$event.preventDefault(); submit()">
        {{ 'app.fulfillerRegistration.submit' | translate }}
      </button>
    </form>
  </section>
</section>
