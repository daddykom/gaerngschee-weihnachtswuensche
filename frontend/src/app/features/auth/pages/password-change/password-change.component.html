<section class="gl-stack gl-stack--group">
  <h2>{{ 'app.passwordChange.heading' | translate }}</h2>
  <p>{{ 'app.passwordChange.passwordRules' | translate }}</p>
  <form class="gl-stack gl-stack--group" (submit)="$event.preventDefault(); onSubmit()">
    @if (email(); as currentEmail) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'app.passwordChange.emailLabel' | translate }}</mat-label>
        <input
          matInput
          type="email"
          name="email"
          autocomplete="username"
          [value]="currentEmail"
          readonly
        />
      </mat-form-field>
    }
    <div class="auth-field-group">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'app.passwordChange.newPasswordLabel' | translate }}</mat-label>
        <input
          matInput
          type="password"
          autocomplete="new-password"
          [formField]="passwordChangeForm.newPassword"
        />
        <app-control-error
          matError
          [control]="passwordChangeForm.newPassword()"
          translationPrefix="app.passwordChange.errors.newPassword"
        />
      </mat-form-field>
    </div>

    <div class="auth-field-group">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'app.passwordChange.confirmationLabel' | translate }}</mat-label>
        <input
          matInput
          type="password"
          autocomplete="new-password"
          [formField]="passwordChangeForm.passwordConfirmation"
        />
        <app-control-error
          matError
          [control]="passwordChangeForm.passwordConfirmation()"
          translationPrefix="app.passwordChange.errors.passwordConfirmation"
        />
      </mat-form-field>
    </div>

    <div class="gl-cluster">
      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="submitting()"
        (click)="$event.preventDefault(); onSubmit()"
      >
        {{ 'app.passwordChange.submit' | translate }}
      </button>
    </div>
  </form>
</section>
