<section class="gl-stack gl-stack--group">
  <h2>{{ 'app.passwordResetRequest.heading' | translate }}</h2>
  @if (sent()) {
    <p role="status">{{ 'app.passwordResetRequest.sent' | translate }}</p>
  } @else {
    <form class="gl-stack gl-stack--group" (submit)="$event.preventDefault(); onSubmit()">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'app.passwordResetRequest.emailLabel' | translate }}</mat-label>
        <input
          matInput
          type="email"
          autocomplete="username"
          [formField]="passwordResetRequestForm.email"
        />
        <app-control-error
          matError
          [control]="passwordResetRequestForm.email()"
          translationPrefix="app.passwordResetRequest.errors.email"
        />
      </mat-form-field>
      <div class="gl-cluster">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
          {{ 'app.passwordResetRequest.submit' | translate }}
        </button>
      </div>
    </form>
  }
</section>
