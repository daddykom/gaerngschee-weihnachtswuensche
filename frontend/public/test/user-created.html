<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dein Benutzerkonto wurde erstellt</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fff7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="width: 100%; background-color: #fff7fb"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #fff8fc;
              border: 1px solid #8c7b85;
              border-radius: 20px;
            "
          >
            <tr>
              <td
                style="padding: 32px 32px 18px 32px; text-align: center; background-color: #f5b6d3"
              >
                <table
                  role="presentation"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  align="center"
                  style="margin: 0 auto 22px auto"
                >
                  <tr>
                    <td align="center">
                      <img
                        src="/gaerngschee-logo.png"
                        width="210"
                        alt="Gärngschee"
                        style="display: block; width: 210px; max-width: 100%; height: auto"
                      />
                    </td>
                  </tr>
                </table>
                <h1
                  style="
                    margin: 0;
                    font-size: 28px;
                    line-height: 1.2;
                    font-weight: 700;
                    color: #000000;
                  "
                >
                  Dein Benutzerkonto wurde erstellt
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 8px 32px; text-align: center">
                <p style="margin: 0 0 14px 0; font-size: 18px; line-height: 1.5; color: #000000">
                  <strong style="color: #276749">Dein Konto ist bereit.</strong>
                </p>
                <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #6f6069">
                  Du kannst dich mit deiner E-Mail-Adresse und dem folgenden temporären Passwort
                  anmelden:
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 8px 32px">
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  style="
                    width: 100%;
                    background-color: #dff4e8;
                    border: 1px solid #8c7b85;
                    border-radius: 14px;
                  "
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        padding: 20px 18px;
                        font-size: 22px;
                        line-height: 1.4;
                        font-weight: 700;
                        letter-spacing: 1px;
                        color: #000000;
                      "
                    >
                      MusterPasswort!42
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 14px 0 0 0;
                    text-align: center;
                    font-size: 15px;
                    line-height: 1.5;
                    color: #6f6069;
                  "
                >
                  Nach der Anmeldung musst du ein neues Passwort setzen.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 22px 32px 34px 32px">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#8a2858" style="border-radius: 999px">
                      <a
                        href="http://localhost:4200/login"
                        style="
                          display: inline-block;
                          padding: 14px 26px;
                          font-size: 17px;
                          line-height: 1;
                          font-weight: 700;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 999px;
                        "
                        >Zur Anmeldung</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
