<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrierung erfolgreich</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 12px;
      background: #fff7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            style="
              max-width: 600px;
              width: 100%;
              background: #fff8fc;
              border: 1px solid #8c7b85;
              border-radius: 20px;
            "
          >
            <tr>
              <td style="padding: 32px; text-align: center; background: #f5b6d3">
                <img
                  src="/gaerngschee-logo.png"
                  width="210"
                  alt="Gärngschee"
                  style="max-width: 100%"
                />
                <h1>Registrierung erfolgreich</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px">
                <p style="font-size: 18px; line-height: 1.5">
                  <strong style="color: #276749">Dein Konto ist eingerichtet.</strong>
                </p>
                <p style="color: #6f6069; line-height: 1.5">
                  Du kannst dich ab sofort jederzeit mit deiner E-Mail-Adresse und dem bei der
                  Registrierung angegebenen Passwort anmelden.
                </p>
                <p style="margin-top: 24px">
                  <a
                    href="https://weihnachtswuensche.example/login"
                    style="
                      display: inline-block;
                      padding: 12px 18px;
                      border-radius: 999px;
                      background: #8a2858;
                      color: #fff;
                      text-decoration: none;
                      font-weight: 700;
                    "
                    >Zur Anmeldung</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
