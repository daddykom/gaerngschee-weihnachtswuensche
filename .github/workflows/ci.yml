name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest unit tests
        run: npm run test:unit -- --configuration=ci

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build -- --configuration=production

  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check Prettier formatting
        run: npx prettier --check . --ignore-path .prettierignore

  deployment-script-test:
    name: deployment-script-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
      - name: Run deployment script tests
        run: bats tests/deployment/deploy.bats

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, zip
          tools: composer
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit tests
        working-directory: backend
        run: vendor/bin/phpunit

  backend-code-style:
    name: backend-code-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, zip
          tools: composer
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP code style
        working-directory: backend
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  backend-production-dependencies:
    name: backend-production-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer
          coverage: none
      - name: Validate Composer configuration
        working-directory: backend
        run: composer validate --no-check-publish
      - name: Install production dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Check production platform requirements
        working-directory: backend
        run: composer check-platform-reqs --no-dev

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e:cli

  frontend-integration-tests:
    name: frontend-integration-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer
          coverage: none
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start and migrate integration environment
        run: npm run integration:setup
      - name: Run integration tests
        run: npm run test:integration
      - name: Upload Playwright integration artifacts
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-artifacts
          path: frontend/dist/.playwright/
          if-no-files-found: ignore
      - name: Stop integration environment
        if: ${{ always() }}
        run: npm run integration:stop
